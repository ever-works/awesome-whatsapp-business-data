company_name: Awesome WhatsApp Business
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome WhatsApp Business
initial_prompt: >-
  A curated directory of WhatsApp Business API providers (BSPs), shared inboxes,
  chatbots and broadcast tools. Include products such as Meta WhatsApp Cloud
  API, Twilio, Bird, 360dialog, Gupshup, Wati, Interakt, AiSensy, respond.io,
  Gallabox, Trengo, Infobip, plus other notable commercial and open-source
  options. Categories: WhatsApp Business API Providers, Shared Team Inbox,
  Chatbots & Automation, Broadcasts & Marketing, Commerce & Catalogs,
  Open-Source SDKs. For every item capture the official website, a short factual
  description, pricing model (free, freemium, paid, open source), deployment
  (cloud or self-hosted), key features and integrations.


  Initial categories: WhatsApp Business API Providers; Shared Team Inbox;
  Chatbots & Automation; Broadcasts & Marketing; Commerce & Catalogs;
  Open-Source SDKs.

  Target keywords: whatsapp business api, whatsapp marketing, whatsapp crm,
  whatsapp chatbot.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.softwaresuggest.com/whatsapp-marketing-software

  - https://raw.githubusercontent.com/awelist/awesome-whatsapp/HEAD/README.md

  - https://github.com/topics/whatsapp

  - https://github.com/topics/whatsapp-api


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-whatsapp-business-website
company_website: https://whatsapp-business.ever.works
