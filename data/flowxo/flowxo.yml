markdown: >-
  ## Overview


  Flow XO is a chatbot and workflow automation platform that supports WhatsApp
  integration for building automated conversational experiences.


  ## Features


  - Chatbot builder for WhatsApp and other channels

  - Workflow automation

  - Multi-channel messaging (WhatsApp, web, Messenger, SMS)

  - Integration with business applications

  - Automated responses and conversations

  - Lead capture and qualification


  ## Pricing


  Paid plans with a free trial available.


  ## Deployment


  Cloud-hosted (SaaS).


  ## Integrations


  WhatsApp, web chat, Messenger, SMS, and various business tools via native
  integrations.
