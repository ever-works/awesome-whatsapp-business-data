markdown: >-
  ## Overview


  Bird is a WhatsApp Business API provider (BSP) offering a unified platform for
  WhatsApp messaging, automation, and customer engagement.


  ## Features


  - **WhatsApp API**: Send notifications, media, and interactive messages from
  your backend with webhooks for replies and read receipts.

  - **Templates**: Design media cards, carousels, and authentication templates
  in Studio; submit multi-language versions for Meta approval.

  - **Conversations**: Reply with free-form text and media during the 24-hour
  customer service window, with read receipts, typing indicators, and reactions.

  - **Native Flows**: Let customers book appointments, pick delivery slots, and
  submit multi-step forms inside the chat without opening a browser.

  - **Broadcasts**: Launch targeted promotions, product drops, and back-in-stock
  campaigns to opted-in audiences and track resulting replies.

  - **AI agents**: Resolve order inquiries and routine support automatically
  from live backend data, then hand complex threads to your team.

  - **Commerce**: Share product cards and catalog items inside the thread so
  shoppers can browse options and move straight to checkout.

  - **Calling**: Escalate complex support or high-consideration sales chats to a
  voice call inside WhatsApp.

  - **Numbers**: Onboard new WhatsApp Business numbers, migrate existing senders
  from another provider, and manage display profiles in one workspace.

  - **Analytics**: Inspect delivery, read, and failure rates by template or
  country, and reconcile message volume against Meta billing categories.


  ## Pricing


  Commercial platform; pricing is usage-based and available upon request from
  Bird.
