name: Evolution API
description: Evolution API is an open-source WhatsApp integration API written in
  TypeScript. It provides a self-hosted gateway for sending and receiving
  WhatsApp messages, managing sessions, and integrating WhatsApp into custom
  applications without relying on the official WhatsApp Business API. Free and
  open source under the MIT license.
