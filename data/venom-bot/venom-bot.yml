markdown: >-
  ## Overview


  Venom Bot is a WhatsApp automation framework for building bots and automation
  tools through WhatsApp Web.


  ## Features


  - WhatsApp Web automation

  - Send and receive messages

  - Session management

  - Media handling

  - Bot creation and automation

  - Contact and group management


  ## Pricing


  Free and open source.


  ## Deployment


  Self-hosted.


  ## Repository


  https://github.com/orkestral/venom
